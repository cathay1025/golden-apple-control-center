name: Sync Notion to control center

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data.json from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/build.py
      - name: Commit if changed
        run: |
          git config user.name "control-center-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "sync: update progress from Notion"
            git push
          else
            echo "no change"
          fi
